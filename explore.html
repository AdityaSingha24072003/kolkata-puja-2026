<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kolkata Durga Puja 2026 - Pandal Explorer & Navigation</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --durga-red: #B71C1C;
      --royal-gold: #D4AF37;
      --gold-gradient: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #AA771C 100%);
      --bg-cream: #FFFDF9;
      --dark-text: #212121;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-cream);
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Top Navigation Header */
    .app-header {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 480px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-container {
      position: relative;
      background: #FFFFFF;
      border: 2px solid var(--royal-gold);
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(183, 28, 28, 0.15);
      display: flex;
      align-items: center;
      padding: 4px 10px;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 14px;
      padding: 8px;
      color: var(--dark-text);
      background: transparent;
    }

    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1px solid var(--royal-gold);
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 4px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      display: none;
      z-index: 1001;
    }

    .search-item {
      padding: 10px;
      font-size: 13px;
      border-bottom: 1px solid #f2f2f2;
      cursor: pointer;
    }

    .search-item:hover {
      background: #FFF9E6;
    }

    /* Floating Explore Drawer Panel */
    .drawer-card {
      position: absolute;
      bottom: 20px;
      left: 12px;
      right: 12px;
      max-width: 420px;
      background: #FFFFFF;
      border: 2px solid var(--royal-gold);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      padding: 14px;
      z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (min-width: 768px) {
      .drawer-card {
        top: 80px;
        bottom: auto;
        left: 12px;
        right: auto;
      }
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--durga-red);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .action-btn {
      flex: 1;
      min-height: 40px;
      border: 1.5px solid var(--durga-red);
      background: #FFFFFF;
      color: var(--durga-red);
      font-weight: 700;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .action-btn.active {
      background: var(--durga-red);
      color: #FFFFFF;
    }

    .buffer-pill-group {
      display: none;
      gap: 6px;
      margin: 10px 0;
    }

    .buffer-pill {
      flex: 1;
      min-height: 46px;
      background: #FFF9E6;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .buffer-pill.selected {
      background: var(--royal-gold);
      color: #7B0000;
      font-weight: bold;
    }

    .pill-km { font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .pill-count { font-size: 15px; font-weight: 900; color: var(--durga-red); }
    .buffer-pill.selected .pill-count { color: #7B0000; }

    .pandal-list-box {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ECECEC;
      border-radius: 6px;
      padding: 4px;
      background: #FFFDF9;
      margin-top: 8px;
    }

    .pandal-row {
      display: flex;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid #F0F0F0;
      font-size: 12px;
      gap: 8px;
    }

    .pandal-row:hover { background: #FFF4D9; }

    .pandal-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--durga-red);
      cursor: pointer;
    }

    .nav-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      background: var(--gold-gradient);
      color: #7B0000;
      border: 1.5px solid #8B0000;
      border-radius: 6px;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.18);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Pop-up Navigation Button */
    .popup-route-btn {
      display: block;
      margin-top: 8px;
      background: var(--gold-gradient);
      color: #7B0000;
      border: 1.5px solid #8B0000;
      text-align: center;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Search Pandal & Landmark Bar -->
  <div class="app-header">
    <div class="search-container">
      <span style="font-size: 16px; margin-right: 4px;">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search pandal, club name, or area..." />
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <!-- Explore & Buffer Control Card -->
  <div class="drawer-card" id="drawerCard">
    <div class="drawer-title">
      <span>🪔 Explore Pandals</span>
      <span id="loader" style="font-size: 11px; color: #888;">Loading data...</span>
    </div>

    <div class="btn-row">
      <button class="action-btn" id="btnGPS" onclick="setOriginGPS()">📍 My Location</button>
      <button class="action-btn" id="btnPin" onclick="activatePinDropMode()">📌 Click On Map</button>
    </div>
    <div id="statusText" style="font-size: 11px; color: #666; margin-bottom: 4px;">Select origin to calculate buffer rings.</div>

    <!-- Buffer Radius Options -->
    <div class="buffer-pill-group" id="bufferGroup">
      <div class="buffer-pill selected" id="pill2" onclick="selectRadius(2)">
        <div class="pill-km">2 KM Radius</div>
        <div class="pill-count" id="count2">-</div>
      </div>
      <div class="buffer-pill" id="pill5" onclick="selectRadius(5)">
        <div class="pill-km">5 KM Radius</div>
        <div class="pill-count" id="count5">-</div>
      </div>
      <div class="buffer-pill" id="pill10" onclick="selectRadius(10)">
        <div class="pill-km">10 KM Radius</div>
        <div class="pill-count" id="count10">-</div>
      </div>
    </div>

    <!-- Checkbox Checklist -->
    <div id="listSection" style="display:none;">
      <div style="font-size: 11px; font-weight: 700; color: #444; margin: 6px 0;">
        Select Pandals to Hop (<span id="selectedCount">0</span> selected):
      </div>
      <div class="pandal-list-box" id="pandalChecklist"></div>

      <button class="nav-btn" id="btnRoute" onclick="launchGoogleMapsRoute()" disabled>
        🧭 Hop Selected in Google Maps
      </button>
    </div>
  </div>

  <script>
    // 1. Initialize Map centered on Kolkata
    const map = L.map('map', { zoomControl: false }).setView([22.565, 88.363], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© CartoDB, © OpenStreetMap'
    }).addTo(map);

    let allPandals = [];
    let pandalMarkers = [];
    let originCoords = null; // [lat, lng]
    let originType = "GPS";
    let currentRadius = 2;
    let filteredPandals = [];
    let selectedPandals = new Set();
    let isPinDropActive = false;

    // Visual graphics
    let originMarker = null;
    let bufferCircle = null;

    // Coordinate parser handling WGS84, inverted [lat, lng], and Web Mercator
    function parseCoords(feature) {
      let c = feature.geometry.coordinates;
      let x = parseFloat(c[0]), y = parseFloat(c[1]);

      // Web Mercator in meters
      if (Math.abs(x) > 180 || Math.abs(y) > 90) {
        let lng = (x / 20037508.34) * 180;
        let lat = (y / 20037508.34) * 180;
        lat = (180 / Math.PI) * (2 * Math.atan(Math.exp(lat * Math.PI / 180)) - Math.PI / 2);
        return [lat, lng];
      }

      // Inverted [Lat, Lng] check for Kolkata bounds (Lat ~22.5, Lng ~88.3)
      if (x >= 21 && x <= 24 && y >= 87 && y <= 90) {
        return [x, y];
      }

      return [y, x]; // Standard GeoJSON [Lng, Lat] converted to Leaflet [Lat, Lng]
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 2. Fetch GeoJSON
    fetch('./pandals_clean.geojson')
      .then(res => res.json())
      .then(data => {
        allPandals = data.features;
        document.getElementById('loader').innerText = allPandals.length + " pandals live";
        renderPandalLayer();
      })
      .catch(err => {
        document.getElementById('loader').innerText = "Load failed: " + err.message;
      });

    // 3. Render Pandal Points with Festive Royal Gold & Durga Red Markers
    function renderPandalLayer() {
      allPandals.forEach(p => {
        const coords = parseCoords(p);
        p.computedCoords = coords;

        const name = p.properties.Pandal___C || p.properties.Name || "Durga Puja Pandal";
        const cat = p.properties.Puja_Categ || "Sarbojanin";

        const marker = L.circleMarker(coords, {
          radius: 6,
          fillColor: "#B71C1C",
          color: "#D4AF37",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        const gmapsSingleUrl = `https://www.google.com/maps/dir/?api=1&destination=${coords[0]},${coords[1]}`;
        const popupHtml = `
          <div style="font-family:sans-serif; min-width: 180px;">
            <b style="color:#B71C1C; font-size:14px;">${name}</b><br/>
            <span style="font-size:12px; color:#555;">Category: ${cat}</span><br/>
            <a class="popup-route-btn" href="${gmapsSingleUrl}" target="_blank">🧭 Navigate in Google Maps</a>
          </div>
        `;
        marker.bindPopup(popupHtml);
        p.marker = marker;
        pandalMarkers.push(p);
      });
    }

    // 4. Live GPS with Fallback
    function setOriginGPS() {
      originType = "GPS";
      isPinDropActive = false;
      document.getElementById('btnGPS').classList.add('active');
      document.getElementById('btnPin').classList.remove('active');
      document.getElementById('statusText').innerText = "Locating your GPS position...";

      navigator.geolocation.getCurrentPosition(
        pos => {
          handleOriginSelected(pos.coords.latitude, pos.coords.longitude, "Live GPS Location");
        },
        err => {
          navigator.geolocation.getCurrentPosition(
            pos => {
              handleOriginSelected(pos.coords.latitude, pos.coords.longitude, "Network Location");
            },
            err2 => {
              document.getElementById('statusText').innerText = "GPS unavailable. Click 'Click On Map' to drop a pin.";
            },
            { enableHighAccuracy: false, timeout: 12000 }
          );
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    }

    // 5. Click Anywhere Directly On the Main Map to Place Pin
    function activatePinDropMode() {
      originType = "PIN";
      isPinDropActive = true;
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      document.getElementById('statusText').innerText = "👉 Click anywhere on the map to set your origin.";
    }

    map.on('click', function(e) {
      if (!isPinDropActive) return;
      handleOriginSelected(e.latlng.lat, e.latlng.lng, `Map Pin (${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)})`);
    });

    function handleOriginSelected(lat, lng, label) {
      originCoords = [lat, lng];
      document.getElementById('statusText').innerText = "Origin: " + label;

      // Draw or move Origin Pin
      if (originMarker) {
        originMarker.setLatLng(originCoords);
      } else {
        originMarker = L.marker(originCoords, {
          icon: L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
          })
        }).addTo(map);
      }

      map.panTo(originCoords);
      calculateBuffers();
    }

    // 6. Draw Animated Festive Buffer Ring & Live Counts
    function calculateBuffers() {
      if (!originCoords || !allPandals.length) return;

      document.getElementById('bufferGroup').style.display = 'flex';
      document.getElementById('listSection').style.display = 'block';

      const count2 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 2).length;
      const count5 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 5).length;
      const count10 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 10).length;

      document.getElementById('count2').innerText = count2;
      document.getElementById('count5').innerText = count5;
      document.getElementById('count10').innerText = count10;

      selectRadius(currentRadius);
    }

    function selectRadius(km) {
      currentRadius = km;
      [2, 5, 10].forEach(k => {
        document.getElementById('pill' + k).classList.toggle('selected', k === km);
      });

      // Update Map Buffer Graphic
      if (bufferCircle) {
        bufferCircle.setLatLng(originCoords);
        bufferCircle.setRadius(km * 1000);
      } else {
        bufferCircle = L.circle(originCoords, {
          radius: km * 1000,
          color: '#B71C1C',
          fillColor: '#D4AF37',
          fillOpacity: 0.15,
          weight: 2,
          dashArray: '6, 6'
        }).addTo(map);
      }

      map.fitBounds(bufferCircle.getBounds(), { padding: [40, 40] });

      // Filter and Sort by Proximity
      filteredPandals = allPandals.map(p => {
        return {
          ...p,
          distance: haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1])
        };
      }).filter(p => p.distance <= km)
        .sort((a, b) => a.distance - b.distance);

      renderChecklist();
    }

    // 7. Checkbox Selection List
    function renderChecklist() {
      const box = document.getElementById('pandalChecklist');
      box.innerHTML = '';
      selectedPandals.clear();
      updateRouteButton();

      if (!filteredPandals.length) {
        box.innerHTML = '<div style="font-size:12px; color:#888; padding:8px; text-align:center;">No pandals found within this radius. Try 5 or 10 KM.</div>';
        return;
      }

      filteredPandals.forEach((p, idx) => {
        const name = p.properties.Pandal___C || p.properties.Name || "Durga Puja Pandal";
        const cat = p.properties.Puja_Categ || "Standard";
        const row = document.createElement('div');
        row.className = 'pandal-row';
        row.innerHTML = `
          <input type="checkbox" id="chk_${idx}" onchange="togglePandal(${idx})">
          <label for="chk_${idx}" style="cursor:pointer; flex:1;">
            <b>${name}</b> <span style="font-size:10px; color:#777;">(${cat})</span><br/>
            <span style="font-size:10px; color:#B71C1C; font-weight:700;">${p.distance.toFixed(2)} km away</span>
          </label>
        `;
        box.appendChild(row);
      });
    }

    function togglePandal(idx) {
      const p = filteredPandals[idx];
      if (selectedPandals.has(p)) {
        selectedPandals.delete(p);
      } else {
        selectedPandals.add(p);
      }
      document.getElementById('selectedCount').innerText = selectedPandals.size;
      updateRouteButton();
    }

    function updateRouteButton() {
      const btn = document.getElementById('btnRoute');
      btn.disabled = selectedPandals.size === 0;
    }

    // 8. Launch Multi-Stop Google Maps Route
    function launchGoogleMapsRoute() {
      if (selectedPandals.size === 0) return;
      const pList = Array.from(selectedPandals);

      let originParam = (originType === "PIN" && originCoords)
        ? `${originCoords[0]},${originCoords[1]}`
        : "Current+Location";

      if (pList.length === 1) {
        const dest = pList[0].computedCoords;
        const singleUrl = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${dest[0]},${dest[1]}&travelmode=driving`;
        window.open(singleUrl, '_blank');
        return;
      }

      const lastPandal = pList[pList.length - 1].computedCoords;
      const intermediateWaypoints = pList.slice(0, pList.length - 1)
        .map(p => `${p.computedCoords[0]},${p.computedCoords[1]}`)
        .join('|');

      const multiUrl = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${lastPandal[0]},${lastPandal[1]}&waypoints=${encodeURIComponent(intermediateWaypoints)}&travelmode=driving`;
      window.open(multiUrl, '_blank');
    }

    // 9. Real-Time Search Bar
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    searchInput.addEventListener('input', function() {
      const q = this.value.trim().toLowerCase();
      if (!q || !allPandals.length) {
        searchResults.style.display = 'none';
        return;
      }

      const matches = allPandals.filter(p => {
        const name = (p.properties.Pandal___C || p.properties.Name || "").toLowerCase();
        const address = (p.properties.Address || "").toLowerCase();
        return name.includes(q) || address.includes(q);
      }).slice(0, 10);

      if (!matches.length) {
        searchResults.innerHTML = '<div class="search-item" style="color:#888;">No matching pandal found</div>';
        searchResults.style.display = 'block';
        return;
      }

      searchResults.innerHTML = matches.map((m, idx) => `
        <div class="search-item" onclick="zoomToSearchedPandal(${allPandals.indexOf(m)})">
          <b>${m.properties.Pandal___C || m.properties.Name}</b><br/>
          <span style="font-size:11px; color:#666;">${m.properties.Puja_Categ || "Standard"}</span>
        </div>
      `).join('');
      searchResults.style.display = 'block';
    });

    function zoomToSearchedPandal(index) {
      const p = allPandals[index];
      searchResults.style.display = 'none';
      searchInput.value = p.properties.Pandal___C || p.properties.Name;
      map.setView(p.computedCoords, 16);
      p.marker.openPopup();
    }

    document.addEventListener('click', function(e) {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });
  </script>
</body>
</html>
