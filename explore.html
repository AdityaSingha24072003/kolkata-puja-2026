<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kolkata Durga Puja 2026 - Pandal Explorer</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --durga-red: #B71C1C;
      --royal-gold: #D4AF37;
      --gold-gradient: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #AA771C 100%);
      --bg-cream: #FFFDF9;
      --dark-text: #212121;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--dark-text);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .main-container {
      width: 100%;
      padding: 8px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    /* Search Box */
    .search-container {
      position: relative;
      background: #FFFFFF;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 3px 6px;
      margin-bottom: 6px;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 13px;
      padding: 5px;
      background: transparent;
      color: var(--dark-text);
    }

    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      max-height: 240px;
      overflow-y: auto;
      margin-top: 3px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
      display: none;
      z-index: 2000;
    }

    .search-segment-title {
      background: #FFF8E7;
      color: var(--durga-red);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 5px 8px;
      border-bottom: 1px solid #F1E2BE;
    }

    .search-item {
      padding: 7px 8px;
      font-size: 12px;
      border-bottom: 1px solid #F5F5F5;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .search-item:hover { background: #FFF3D6; }
    .search-item-sub { font-size: 10px; color: #666; margin-top: 1px; }

    /* Action Buttons */
    .btn-row { display: flex; gap: 6px; margin-bottom: 4px; }

    .action-btn {
      flex: 1;
      min-height: 36px;
      border: 1.5px solid var(--durga-red);
      background: #FFFFFF;
      color: var(--durga-red);
      font-weight: 700;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .action-btn.active { background: var(--durga-red); color: #FFFFFF; }

    /* Map Window */
    #aoiPickerContainer {
      height: 210px;
      width: 100%;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      margin: 4px 0 6px 0;
      overflow: hidden;
      position: relative;
      background: #f8f8f8;
    }

    /* Pulsating Buffer Animation */
    .animated-buffer-circle {
      stroke-dasharray: 6, 6;
      animation: bufferPulse 2.8s linear infinite;
    }

    @keyframes bufferPulse {
      0% { stroke-dashoffset: 0; fill-opacity: 0.12; }
      50% { stroke-dashoffset: -24; fill-opacity: 0.24; }
      100% { stroke-dashoffset: -48; fill-opacity: 0.12; }
    }

    .status-msg {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
      min-height: 16px;
    }
    .status-msg.error {
      color: #B71C1C;
      font-weight: bold;
    }

    /* Buffer Pills */
    .buffer-pill-group {
      display: flex;
      gap: 6px;
      margin: 4px 0 6px 0;
    }

    .buffer-pill {
      flex: 1;
      min-height: 42px;
      background: #FFF9E6;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.15s ease;
    }
    .buffer-pill:active { transform: scale(0.97); }
    .buffer-pill.selected {
      background: var(--royal-gold);
      color: #7B0000;
      font-weight: bold;
    }
    .pill-km { font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .pill-count { font-size: 14px; font-weight: 900; color: var(--durga-red); }
    .buffer-pill.selected .pill-count { color: #7B0000; }

    /* Pandal Checklist Section */
    #listSection {
      display: none; /* Hidden until origin is selected and pandals exist */
      margin-top: 4px;
    }

    .pandal-list-box {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #ECECEC;
      border-radius: 6px;
      padding: 4px;
      background: #FFFDF9;
      margin-top: 4px;
    }

    .pandal-row {
      display: flex;
      align-items: flex-start;
      padding: 8px 6px;
      border-bottom: 1px solid #F0F0F0;
      font-size: 12px;
      gap: 8px;
    }
    .pandal-row:hover { background: #FFF4D9; }
    .pandal-row input {
      width: 17px;
      height: 17px;
      accent-color: var(--durga-red);
      cursor: pointer;
      margin-top: 2px;
    }

    /* Structured Field Badges */
    .field-tag-category {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #8B0000;
      background: #FFE8E8;
      border: 1px solid #F5B7B7;
      padding: 1px 5px;
      border-radius: 3px;
      margin-right: 4px;
    }

    .field-tag-locality {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: #555;
      background: #F0F0F0;
      border: 1px solid #D5D5D5;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .field-theme-title {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #996515;
    }

    .field-theme-details {
      display: block;
      margin-top: 2px;
      font-size: 10.5px;
      color: #555;
      line-height: 1.3;
    }

    .nav-btn {
      width: 100%;
      min-height: 40px;
      margin-top: 6px;
      background: var(--gold-gradient);
      color: #7B0000;
      border: 1.5px solid #8B0000;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Search Bar -->
    <div class="search-container">
      <span style="font-size: 14px; margin-right: 4px;">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search pandal, locality, or theme..." />
      <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Origin Action Buttons -->
    <div class="btn-row">
      <button class="action-btn" id="btnGPS" onclick="setOriginGPS()">📍 My Location</button>
      <button class="action-btn active" id="btnPin" onclick="activatePinDrop()">📌 Tap in AOI</button>
    </div>
    <div id="statusText" class="status-msg">Tap inside the Kolkata AOI boundary to set origin:</div>

    <!-- Map Window -->
    <div id="aoiPickerContainer"></div>

    <!-- Buffer Radius Controls -->
    <div class="buffer-pill-group" id="bufferGroup">
      <div class="buffer-pill selected" id="pill2" onclick="selectRadius(2)">
        <div class="pill-km">2 KM RADIUS</div>
        <div class="pill-count" id="count2">-</div>
      </div>
      <div class="buffer-pill" id="pill5" onclick="selectRadius(5)">
        <div class="pill-km">5 KM RADIUS</div>
        <div class="pill-count" id="count5">-</div>
      </div>
      <div class="buffer-pill" id="pill10" onclick="selectRadius(10)">
        <div class="pill-km">10 KM RADIUS</div>
        <div class="pill-count" id="count10">-</div>
      </div>
    </div>

    <!-- Pandal Checklist (Populates dynamically after setting origin) -->
    <div id="listSection">
      <div style="font-size: 11px; font-weight: 700; color: #444; margin: 2px 0;">
        Select Pandals to Hop (<span id="selectedCount">0</span> selected):
      </div>
      <div class="pandal-list-box" id="pandalChecklist"></div>

      <button class="nav-btn" id="btnRoute" onclick="launchGoogleMapsRoute()" disabled>
        🧭 Hop Selected in Google Maps
      </button>
    </div>
  </div>

  <script>
    const TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const TILE_ATTRIB = '&copy; OpenStreetMap';

    let map = null;
    let aoiGeoJSONData = null;
    let aoiLayer = null;
    let originMarker = null;
    let bufferCircle = null;
    let pandalMarkersLayer = L.layerGroup();

    let allPandals = [];
    let originCoords = null;
    let originType = "PIN";
    let currentRadius = 2;
    let filteredPandals = [];
    let selectedPandals = new Set();
    let currentAnimatedRadius = 2000;
    let animFrameId = null;

    // 1. Initialize Map
    map = L.map('aoiPickerContainer', {
      zoomControl: false,
      attributionControl: false,
      zoomSnap: 0.1,
      zoomDelta: 0.5,
      maxZoom: 18
    }).setView([22.565, 88.363], 12.5);

    L.tileLayer(TILE_URL, { maxZoom: 18 }).addTo(map);
    pandalMarkersLayer.addTo(map);

    function parseCoords(feature) {
      if (!feature.geometry || !feature.geometry.coordinates) return [22.565, 88.363];
      let c = feature.geometry.coordinates;
      let x = parseFloat(c[0]), y = parseFloat(c[1]);

      if (Math.abs(x) > 180 || Math.abs(y) > 90) {
        let lng = (x / 20037508.34) * 180;
        let lat = (y / 20037508.34) * 180;
        lat = (180 / Math.PI) * (2 * Math.atan(Math.exp(lat * Math.PI / 180)) - Math.PI / 2);
        return [lat, lng];
      }

      if (x >= 21 && x <= 24 && y >= 87 && y <= 90) {
        return [x, y];
      }

      return [y, x];
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function isPointInPoly(pt, polyCoords) {
      let x = pt[1], y = pt[0];
      let inside = false;
      for (let i = 0, j = polyCoords.length - 1; i < polyCoords.length; j = i++) {
        let xi = polyCoords[i][0], yi = polyCoords[i][1];
        let xj = polyCoords[j][0], yj = polyCoords[j][1];
        let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function isInsideAOI(lat, lng) {
      if (!aoiGeoJSONData) return true;
      const pt = [lat, lng];

      for (let feature of (aoiGeoJSONData.features || [aoiGeoJSONData])) {
        if (!feature.geometry) continue;
        const geom = feature.geometry;
        if (geom.type === "Polygon") {
          if (isPointInPoly(pt, geom.coordinates[0])) return true;
        } else if (geom.type === "MultiPolygon") {
          for (let poly of geom.coordinates) {
            if (isPointInPoly(pt, poly[0])) return true;
          }
        }
      }
      return false;
    }

    // Comprehensive field extractors matching your exact dataset schema
    function getPandalField(p, keys) {
      const props = p.properties || {};
      for (let k of keys) {
        if (props[k] !== undefined && props[k] !== null && String(props[k]).trim() !== "") {
          return String(props[k]).trim();
        }
      }
      return "";
    }

    function getPandalData(p) {
      const name = getPandalField(p, ['Pandal___C', 'Pandal_Name', 'Name', 'pandal_name', 'pandal']) || 'Durga Puja Pandal';
      const category = getPandalField(p, ['Puja Category', 'Puja_Category', 'Puja_Categ', 'Category', 'puja_category', 'Puja_Cat']) || 'Sarbojanin';
      const themeTitle = getPandalField(p, ['Theme Title', 'Theme_Title', 'Theme_Titl', 'Theme', 'Theme_Name', 'theme_title']) || '';
      const themeDetails = getPandalField(p, ['Theme Details', 'Theme_Details', 'Theme_Deta', 'Theme_Desc', 'Description', 'theme_details']) || '';
      const locality = getPandalField(p, ['Locality', 'locality', 'Location', 'Zone', 'Address']) || '';

      return { name, category, themeTitle, themeDetails, locality };
    }

    // 2. Fetch AOI GeoJSON
    fetch('./aoi.geojson?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        aoiGeoJSONData = data;
        aoiLayer = L.geoJSON(data, {
          style: {
            color: "#B71C1C",
            weight: 2,
            fillColor: "#D4AF37",
            fillOpacity: 0.10
          }
        }).addTo(map);

        const paddedBounds = aoiLayer.getBounds().pad(0.35);
        const calculatedMinZoom = map.getBoundsZoom(paddedBounds);
        map.setMinZoom(calculatedMinZoom);
        map.setMaxBounds(paddedBounds.pad(0.15));
        map.setView([22.565, 88.363], 12.5);
      })
      .catch(err => {
        console.warn("aoi.geojson load fallback", err);
        map.setMinZoom(10);
      });

    // 3. Fetch Pandals
    fetch('./pandals_clean.geojson?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        allPandals = data.features || [];
        allPandals.forEach(p => { p.computedCoords = parseCoords(p); });
      })
      .catch(err => {
        showStatus("Data load error: " + err.message, true);
      });

    function showStatus(msg, isError = false) {
      const el = document.getElementById('statusText');
      el.innerText = msg;
      el.className = "status-msg" + (isError ? " error" : "");
    }

    // 4. Map Click
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      if (!isInsideAOI(lat, lng)) {
        showStatus("⚠️ Click is outside Kolkata AOI boundary. Pick inside boundary.", true);
        return;
      }

      originType = "PIN";
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      handleOriginSet(lat, lng, `AOI Pin (${lat.toFixed(3)}, ${lng.toFixed(3)})`);
    });

    function activatePinDrop() {
      originType = "PIN";
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      showStatus("Tap inside the Kolkata AOI boundary to set origin:");
    }

    function setOriginGPS() {
      originType = "GPS";
      document.getElementById('btnGPS').classList.add('active');
      document.getElementById('btnPin').classList.remove('active');
      showStatus("Detecting GPS position...");

      if (!navigator.geolocation) {
        showStatus("Geolocation not supported. Please tap inside AOI.", true);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (!isInsideAOI(lat, lng)) {
            resetToUnselected();
            showStatus("⚠️ Your current location is outside the Kolkata Puja AOI. Working not possible with this location.", true);
            return;
          }

          handleOriginSet(lat, lng, "Live GPS Location");
        },
        err => {
          navigator.geolocation.getCurrentPosition(
            pos => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              if (!isInsideAOI(lat, lng)) {
                resetToUnselected();
                showStatus("⚠️ Network location is outside Kolkata AOI. Working not possible with this location.", true);
                return;
              }
              handleOriginSet(lat, lng, "Network Location");
            },
            err2 => {
              showStatus("GPS unavailable. Tap inside the AOI map window.", true);
            },
            { enableHighAccuracy: false, timeout: 10000 }
          );
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    }

    function resetToUnselected() {
      originCoords = null;
      if (originMarker) { map.removeLayer(originMarker); originMarker = null; }
      if (bufferCircle) { map.removeLayer(bufferCircle); bufferCircle = null; }
      pandalMarkersLayer.clearLayers();
      document.getElementById('count2').innerText = "-";
      document.getElementById('count5').innerText = "-";
      document.getElementById('count10').innerText = "-";
      document.getElementById('listSection').style.display = 'none';
      document.getElementById('btnRoute').disabled = true;
    }

    // 5. Origin Setter & Dynamic Buffer Animation
    function handleOriginSet(lat, lng, label) {
      originCoords = [lat, lng];
      showStatus("Origin: " + label);

      if (originMarker) {
        originMarker.setLatLng(originCoords);
      } else {
        originMarker = L.marker(originCoords, {
          icon: L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [22, 36], iconAnchor: [11, 36]
          })
        }).addTo(map);
      }

      calculateBuffers();
    }

    function calculateBuffers() {
      if (!originCoords || !allPandals.length) return;

      const count2 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 2).length;
      const count5 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 5).length;
      const count10 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 10).length;

      document.getElementById('count2').innerText = count2;
      document.getElementById('count5').innerText = count5;
      document.getElementById('count10').innerText = count10;

      selectRadius(currentRadius);
    }

    function animateRadiusTo(targetRadiusMeters) {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const startRadius = currentAnimatedRadius || targetRadiusMeters;
      const startTime = performance.now();
      const duration = 280;

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const r = startRadius + (targetRadiusMeters - startRadius) * ease;
        currentAnimatedRadius = r;
        if (bufferCircle) bufferCircle.setRadius(r);

        if (progress < 1) {
          animFrameId = requestAnimationFrame(step);
        }
      }
      animFrameId = requestAnimationFrame(step);
    }

    function selectRadius(km) {
      currentRadius = km;
      [2, 5, 10].forEach(k => {
        document.getElementById('pill' + k).classList.toggle('selected', k === km);
      });

      if (!originCoords) return;

      const targetRadiusMeters = km * 1000;

      if (bufferCircle) {
        bufferCircle.setLatLng(originCoords);
        animateRadiusTo(targetRadiusMeters);
      } else {
        currentAnimatedRadius = targetRadiusMeters;
        bufferCircle = L.circle(originCoords, {
          radius: targetRadiusMeters,
          color: '#B71C1C',
          fillColor: '#D4AF37',
          fillOpacity: 0.16,
          weight: 2,
          className: 'animated-buffer-circle'
        }).addTo(map);
      }

      const targetBounds = L.latLng(originCoords[0], originCoords[1]).toBounds(targetRadiusMeters * 2);
      map.flyToBounds(targetBounds, {
        padding: [14, 14],
        duration: 0.65,
        easeLinearity: 0.25
      });

      filteredPandals = allPandals.map(p => ({
        ...p,
        distance: haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1])
      })).filter(p => p.distance <= km)
        .sort((a, b) => a.distance - b.distance);

      pandalMarkersLayer.clearLayers();
      filteredPandals.forEach(p => {
        const info = getPandalData(p);

        const m = L.circleMarker(p.computedCoords, {
          radius: 5,
          fillColor: "#B71C1C",
          color: "#D4AF37",
          weight: 1.5,
          fillOpacity: 0.95
        }).bindPopup(`
          <div style="font-size:12px; font-family:sans-serif; min-width:180px;">
            <b style="color:#B71C1C; font-size:13px;">${info.name}</b><br/>
            ${info.locality ? `<span style="color:#666; font-size:11px;">📍 ${info.locality}</span><br/>` : ''}
            <span style="display:inline-block; margin-top:2px; font-size:10px; background:#FFE8E8; color:#8B0000; padding:1px 4px; border-radius:3px;">${info.category}</span><br/>
            ${info.themeTitle ? `<div style="margin-top:4px; font-size:11px; color:#996515;"><b>Theme:</b> ${info.themeTitle}</div>` : ''}
            ${info.themeDetails ? `<div style="font-size:10.5px; color:#555; margin-top:2px;">${info.themeDetails}</div>` : ''}
            <div style="font-size:10px; color:#888; margin-top:4px;"><b>${p.distance.toFixed(2)} km away</b></div>
          </div>
        `);
        pandalMarkersLayer.addLayer(m);
      });

      renderChecklist();
    }

    // 6. Checklist Renderer: Displaying Category, Locality, Theme Title, and Theme Details
    function renderChecklist() {
      const section = document.getElementById('listSection');
      const box = document.getElementById('pandalChecklist');
      box.innerHTML = '';
      selectedPandals.clear();
      updateRouteButton();

      if (!filteredPandals.length) {
        section.style.display = 'block';
        box.innerHTML = '<div style="font-size:11px; color:#888; padding:10px; text-align:center;">No pandals found in this radius. Try 5 or 10 KM.</div>';
        return;
      }

      section.style.display = 'block';

      filteredPandals.forEach((p, idx) => {
        const info = getPandalData(p);

        const row = document.createElement('div');
        row.className = 'pandal-row';
        row.innerHTML = `
          <input type="checkbox" id="chk_${idx}" onchange="togglePandal(${idx})">
          <label for="chk_${idx}" style="cursor:pointer; flex:1;">
            <b>${info.name}</b>
            <div style="margin: 2px 0;">
              ${info.category ? `<span class="field-tag-category">${info.category}</span>` : ''}
              ${info.locality ? `<span class="field-tag-locality">📍 ${info.locality}</span>` : ''}
            </div>
            ${info.themeTitle ? `<span class="field-theme-title">🎭 ${info.themeTitle}</span>` : ''}
            ${info.themeDetails ? `<span class="field-theme-details">${info.themeDetails}</span>` : ''}
            <div style="font-size:10px; color:#B71C1C; font-weight:700; margin-top:3px;">${p.distance.toFixed(2)} km away</div>
          </label>
        `;
        box.appendChild(row);
      });
    }

    function togglePandal(idx) {
      const p = filteredPandals[idx];
      if (selectedPandals.has(p)) selectedPandals.delete(p);
      else selectedPandals.add(p);
      document.getElementById('selectedCount').innerText = selectedPandals.size;
      updateRouteButton();
    }

    function updateRouteButton() {
      document.getElementById('btnRoute').disabled = selectedPandals.size === 0;
    }

    function launchGoogleMapsRoute() {
      if (selectedPandals.size === 0) return;
      const pList = Array.from(selectedPandals);

      let originParam = (originType === "PIN" && originCoords)
        ? `${originCoords[0]},${originCoords[1]}`
        : "Current+Location";

      if (pList.length === 1) {
        const dest = pList[0].computedCoords;
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${dest[0]},${dest[1]}&travelmode=driving`, '_blank');
        return;
      }

      const lastPandal = pList[pList.length - 1].computedCoords;
      const intermediate = pList.slice(0, -1).map(p => `${p.computedCoords[0]},${p.computedCoords[1]}`).join('|');
      window.open(`https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${lastPandal[0]},${lastPandal[1]}&waypoints=${encodeURIComponent(intermediate)}&travelmode=driving`, '_blank');
    }

    // 7. Search Input (Searches across Name, Locality, Category, and Themes)
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let searchDebounce = null;

    searchInput.addEventListener('input', function() {
      clearTimeout(searchDebounce);
      const query = this.value.trim();
      if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
      }
      searchDebounce = setTimeout(() => executeSearch(query), 250);
    });

    async function executeSearch(query) {
      const qLower = query.toLowerCase();

      const matchedPandals = allPandals.filter(p => {
        const info = getPandalData(p);
        return info.name.toLowerCase().includes(qLower) ||
               info.locality.toLowerCase().includes(qLower) ||
               info.category.toLowerCase().includes(qLower) ||
               info.themeTitle.toLowerCase().includes(qLower) ||
               info.themeDetails.toLowerCase().includes(qLower);
      }).slice(0, 5);

      let matchedPlaces = [];
      try {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query + ' Kolkata')}&lat=22.565&lon=88.363&limit=5`);
        const json = await res.json();
        matchedPlaces = (json.features || []).map(f => ({
          name: f.properties.name || f.properties.street || query,
          sub: [f.properties.district, f.properties.city].filter(Boolean).join(', ') || 'Kolkata',
          lat: f.geometry.coordinates[1],
          lon: f.geometry.coordinates[0]
        }));
      } catch (err) {
        console.warn("Place search error", err);
      }

      renderDividedResults(matchedPandals, matchedPlaces);
    }

    function renderDividedResults(pandals, places) {
      if (!pandals.length && !places.length) {
        searchResults.innerHTML = '<div style="padding:10px; font-size:12px; color:#888;">No matching pandals or places found.</div>';
        searchResults.style.display = 'block';
        return;
      }

      let html = '';

      if (pandals.length) {
        html += '<div class="search-segment-title">🪔 Durga Puja Pandals</div>';
        pandals.forEach(p => {
          const idx = allPandals.indexOf(p);
          const info = getPandalData(p);
          html += `
            <div class="search-item" onclick="selectPandalResult(${idx})">
              <b>${info.name}</b>
              <span class="search-item-sub">
                ${info.locality ? `📍 ${info.locality} • ` : ''}${info.category}
                ${info.themeTitle ? ` • 🎭 ${info.themeTitle}` : ''}
              </span>
            </div>
          `;
        });
      }

      if (places.length) {
        html += '<div class="search-segment-title">📍 Places & Landmarks</div>';
        places.forEach(pl => {
          html += `
            <div class="search-item" onclick="selectPlaceResult(${pl.lat}, ${pl.lon}, '${pl.name.replace(/'/g, "\\'")}')">
              <b>📍 ${pl.name}</b>
              <span class="search-item-sub">${pl.sub}</span>
            </div>
          `;
        });
      }

      searchResults.innerHTML = html;
      searchResults.style.display = 'block';
    }

    function selectPandalResult(idx) {
      const p = allPandals[idx];
      const info = getPandalData(p);
      searchResults.style.display = 'none';
      searchInput.value = info.name;
      originType = "PIN";
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      handleOriginSet(p.computedCoords[0], p.computedCoords[1], info.name);
    }

    function selectPlaceResult(lat, lng, name) {
      searchResults.style.display = 'none';
      searchInput.value = name;

      if (!isInsideAOI(lat, lng)) {
        showStatus("⚠️ '" + name + "' is outside Kolkata AOI boundary.", true);
        return;
      }

      originType = "PIN";
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      handleOriginSet(lat, lng, name);
    }

    document.addEventListener('click', function(e) {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });
  </script>
</body>
</html>
