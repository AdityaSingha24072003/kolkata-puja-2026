<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Explore Pandals</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --durga-red: #B71C1C;
      --royal-gold: #D4AF37;
      --gold-gradient: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #AA771C 100%);
      --bg-cream: #FFFDF9;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 10px;
      background: var(--bg-cream); color: #212121;
    }
    .card {
      background: #FFFFFF;
      border: 1.5px solid var(--royal-gold);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 4px 12px rgba(183, 28, 28, 0.08);
    }
    .header-title {
      font-size: 15px; font-weight: 800; color: var(--durga-red);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
    }
    .btn-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .action-btn {
      flex: 1; min-height: 38px;
      border: 1.5px solid var(--durga-red);
      background: #fff; color: var(--durga-red);
      font-weight: 700; font-size: 12px;
      border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    .action-btn.active, .action-btn:hover { background: var(--durga-red); color: #fff; }
    #pickerMap {
      height: 180px; width: 100%; border-radius: 6px;
      border: 1.5px solid var(--royal-gold); margin: 8px 0; display: none;
    }
    .buffer-pill-group { display: flex; gap: 6px; margin: 8px 0; }
    .buffer-pill {
      flex: 1; min-height: 46px; background: #fdf8eb;
      border: 1.5px solid var(--royal-gold); border-radius: 6px;
      padding: 4px; text-align: center; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center;
    }
    .buffer-pill.selected { background: var(--royal-gold); color: #7B0000; font-weight: bold; }
    .pill-km { font-size: 11px; font-weight: bold; }
    .pill-count { font-size: 14px; font-weight: 800; color: var(--durga-red); }
    .buffer-pill.selected .pill-count { color: #7B0000; }
    .pandal-list-box {
      max-height: 220px; overflow-y: auto; margin-top: 8px;
      border: 1px solid #eee; border-radius: 6px; padding: 4px; background: #fff;
    }
    .pandal-row {
      display: flex; align-items: center; padding: 7px 6px;
      border-bottom: 1px solid #f0f0f0; font-size: 12px; gap: 8px;
    }
    .pandal-row:hover { background: #fdf5e6; }
    .pandal-row input { width: 18px; height: 18px; accent-color: var(--durga-red); cursor: pointer; }
    .nav-btn {
      width: 100%; min-height: 42px; margin-top: 10px;
      background: var(--gold-gradient); color: #7B0000;
      border: 1.5px solid #8B0000; border-radius: 6px;
      font-weight: 800; font-size: 12px; text-transform: uppercase;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-title">🪔 Explore Pandals</div>

    <div class="btn-row">
      <button class="action-btn" id="btnGPS" onclick="setOriginGPS()">📍 My Location</button>
      <button class="action-btn" id="btnPin" onclick="togglePinPicker()">📌 Tap Pin on Map</button>
    </div>
    <div id="statusText" style="font-size: 11px; color: #666; margin-bottom: 6px;">Select origin to start buffer search.</div>

    <!-- Interactive Pin Drop Container -->
    <div id="pickerMap"></div>

    <div class="buffer-pill-group" id="bufferGroup" style="display:none;">
      <div class="buffer-pill selected" id="pill2" onclick="selectRadius(2)">
        <div class="pill-km">2 KM</div>
        <div class="pill-count" id="count2">-</div>
      </div>
      <div class="buffer-pill" id="pill5" onclick="selectRadius(5)">
        <div class="pill-km">5 KM</div>
        <div class="pill-count" id="count5">-</div>
      </div>
      <div class="buffer-pill" id="pill10" onclick="selectRadius(10)">
        <div class="pill-km">10 KM</div>
        <div class="pill-count" id="count10">-</div>
      </div>
    </div>

    <div id="listSection" style="display:none;">
      <div style="font-size: 11px; font-weight: bold; margin-top: 8px; color: #555;">
        Select Pandals (<span id="selectedCount">0</span> selected):
      </div>
      <div class="pandal-list-box" id="pandalChecklist"></div>

      <button class="nav-btn" id="btnRoute" onclick="launchGoogleMapsRoute()" disabled>
        🧭 Hop Selected Pandals in Google Maps
      </button>
    </div>
  </div>

  <script>
    let originCoords = null;
    let originType = "GPS";
    let allPandals = [];
    let currentRadius = 2;
    let filteredPandals = [];
    let selectedPandals = new Set();
    let miniMap = null;
    let originMarker = null;

    function haversine(c1, c2) {
      const R = 6371;
      const dLat = (c2[1] - c1[1]) * Math.PI / 180;
      const dLng = (c2[0] - c1[0]) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(c1[1] * Math.PI / 180) * Math.cos(c2[1] * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    fetch("./pandals_clean.geojson")
      .then(res => res.json())
      .then(data => { allPandals = data.features; });

    function setOriginGPS() {
      originType = "GPS";
      document.getElementById("btnGPS").classList.add("active");
      document.getElementById("btnPin").classList.remove("active");
      document.getElementById("pickerMap").style.display = "none";
      document.getElementById("statusText").innerText = "Detecting GPS location...";

      if (!navigator.geolocation) {
        document.getElementById("statusText").innerText = "Geolocation not supported.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        onGPSSuccess,
        function(err) {
          navigator.geolocation.getCurrentPosition(
            onGPSSuccess,
            function(err2) {
              document.getElementById("statusText").innerText = "GPS unavailable. Please tap 'Tap Pin on Map'.";
            },
            { enableHighAccuracy: false, timeout: 12000 }
          );
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    }

    function onGPSSuccess(pos) {
      originCoords = [pos.coords.longitude, pos.coords.latitude];
      document.getElementById("statusText").innerText = "Origin: Your Live Location";
      calculateBuffers();
    }

    function togglePinPicker() {
      originType = "PIN";
      document.getElementById("btnPin").classList.add("active");
      document.getElementById("btnGPS").classList.remove("active");
      const mapDiv = document.getElementById("pickerMap");
      mapDiv.style.display = "block";
      document.getElementById("statusText").innerText = "Tap any road or crossing on the map below:";

      if (!miniMap) {
        miniMap = L.map('pickerMap').setView([22.565, 88.363], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '© OpenStreetMap'
        }).addTo(miniMap);

        miniMap.on('click', function(e) {
          const lat = e.latlng.lat;
          const lng = e.latlng.lng;
          originCoords = [lng, lat];

          if (originMarker) {
            originMarker.setLatLng(e.latlng);
          } else {
            originMarker = L.marker(e.latlng).addTo(miniMap);
          }

          document.getElementById("statusText").innerText = "Origin: Pinned at (" + lat.toFixed(4) + ", " + lng.toFixed(4) + ")";
          calculateBuffers();
        });
      } else {
        miniMap.invalidateSize();
      }
    }

    function calculateBuffers() {
      if (!originCoords || !allPandals.length) return;
      document.getElementById("bufferGroup").style.display = "flex";
      document.getElementById("listSection").style.display = "block";

      const count2 = allPandals.filter(p => haversine(originCoords, p.geometry.coordinates) <= 2).length;
      const count5 = allPandals.filter(p => haversine(originCoords, p.geometry.coordinates) <= 5).length;
      const count10 = allPandals.filter(p => haversine(originCoords, p.geometry.coordinates) <= 10).length;

      document.getElementById("count2").innerText = count2;
      document.getElementById("count5").innerText = count5;
      document.getElementById("count10").innerText = count10;

      selectRadius(currentRadius);
    }

    function selectRadius(km) {
      currentRadius = km;
      [2, 5, 10].forEach(k => {
        document.getElementById("pill" + k).classList.toggle("selected", k === km);
      });

      filteredPandals = allPandals.map(p => {
        return { ...p, distKm: haversine(originCoords, p.geometry.coordinates) };
      }).filter(p => p.distKm <= km)
        .sort((a, b) => a.distKm - b.distKm);

      renderChecklist();
    }

    function renderChecklist() {
      const box = document.getElementById("pandalChecklist");
      box.innerHTML = "";
      selectedPandals.clear();
      updateRouteButton();

      if (!filteredPandals.length) {
        box.innerHTML = '<div style="font-size:12px; color:#888; padding:8px; text-align:center;">No pandals found in this radius.</div>';
        return;
      }

      filteredPandals.forEach((p, idx) => {
        const name = p.properties.Pandal___C || "Unnamed Pandal";
        const cat = p.properties.Puja_Categ || "Standard";
        const row = document.createElement("div");
        row.className = "pandal-row";
        row.innerHTML = `
          <input type="checkbox" id="chk_${idx}" onchange="togglePandal(${idx})">
          <label for="chk_${idx}" style="cursor:pointer; flex:1;">
            <strong>${name}</strong> <span style="font-size:10px; color:#777;">(${cat})</span><br/>
            <span style="font-size:10px; color:#B71C1C; font-weight:600;">${p.distKm.toFixed(2)} km away</span>
          </label>
        `;
        box.appendChild(row);
      });
    }

    function togglePandal(idx) {
      const p = filteredPandals[idx];
      if (selectedPandals.has(p)) {
        selectedPandals.delete(p);
      } else {
        selectedPandals.add(p);
      }
      document.getElementById("selectedCount").innerText = selectedPandals.size;
      updateRouteButton();
    }

    function updateRouteButton() {
      const btn = document.getElementById("btnRoute");
      btn.disabled = selectedPandals.size === 0;
    }

    function launchGoogleMapsRoute() {
      if (selectedPandals.size === 0) return;
      const pList = Array.from(selectedPandals);

      let originParam = "Current+Location";
      if (originType === "PIN") {
        originParam = `${originCoords[1]},${originCoords[0]}`;
      }

      if (pList.length === 1) {
        const dest = pList[0].geometry.coordinates;
        const url = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${dest[1]},${dest[0]}&travelmode=driving`;
        window.open(url, "_blank");
        return;
      }

      const lastPandal = pList[pList.length - 1].geometry.coordinates;
      const intermediateWaypoints = pList.slice(0, pList.length - 1).map(p => {
        const c = p.geometry.coordinates;
        return `${c[1]},${c[0]}`;
      }).join("|");

      const multiUrl = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${lastPandal[1]},${lastPandal[0]}&waypoints=${encodeURIComponent(intermediateWaypoints)}&travelmode=driving`;
      window.open(multiUrl, "_blank");
    }
  </script>
</body>
</html>
