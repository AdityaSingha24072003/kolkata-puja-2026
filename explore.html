<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kolkata Durga Puja 2026 - Pandal Explorer</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --durga-red: #B71C1C;
      --royal-gold: #D4AF37;
      --gold-gradient: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #AA771C 100%);
      --bg-cream: #FFFDF9;
      --dark-text: #212121;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--dark-text);
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Container fills width without double inner/outer framing borders */
    .main-container {
      width: 100%;
      padding: 8px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    /* Search Container */
    .search-container {
      position: relative;
      background: #FFFFFF;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 3px 6px;
      margin-bottom: 6px;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 13px;
      padding: 5px;
      background: transparent;
      color: var(--dark-text);
    }

    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 3px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
      display: none;
      z-index: 2000;
    }

    .search-segment-title {
      background: #FFF8E7;
      color: var(--durga-red);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 5px 8px;
      border-bottom: 1px solid #F1E2BE;
    }

    .search-item {
      padding: 7px 8px;
      font-size: 12px;
      border-bottom: 1px solid #F5F5F5;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .search-item:hover { background: #FFF3D6; }
    .search-item-sub { font-size: 10px; color: #666; margin-top: 1px; }

    /* Action Buttons */
    .btn-row { display: flex; gap: 6px; margin-bottom: 4px; }

    .action-btn {
      flex: 1;
      min-height: 36px;
      border: 1.5px solid var(--durga-red);
      background: #FFFFFF;
      color: var(--durga-red);
      font-weight: 700;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .action-btn.active { background: var(--durga-red); color: #FFFFFF; }

    /* Clean Map Window */
    #aoiPickerContainer {
      height: 190px;
      width: 100%;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      margin: 4px 0 6px 0;
      overflow: hidden;
      position: relative;
    }

    /* Buffer Pills */
    .buffer-pill-group {
      display: flex;
      gap: 6px;
      margin: 4px 0 6px 0;
    }

    .buffer-pill {
      flex: 1;
      min-height: 42px;
      background: #FFF9E6;
      border: 1.5px solid var(--royal-gold);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .buffer-pill.selected {
      background: var(--royal-gold);
      color: #7B0000;
      font-weight: bold;
    }
    .pill-km { font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .pill-count { font-size: 14px; font-weight: 900; color: var(--durga-red); }
    .buffer-pill.selected .pill-count { color: #7B0000; }

    /* Pandal Checklist */
    .pandal-list-box {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #ECECEC;
      border-radius: 6px;
      padding: 4px;
      background: #FFFDF9;
      margin-top: 4px;
    }

    .pandal-row {
      display: flex;
      align-items: center;
      padding: 6px 5px;
      border-bottom: 1px solid #F0F0F0;
      font-size: 12px;
      gap: 8px;
    }
    .pandal-row:hover { background: #FFF4D9; }
    .pandal-row input {
      width: 17px;
      height: 17px;
      accent-color: var(--durga-red);
      cursor: pointer;
    }

    .nav-btn {
      width: 100%;
      min-height: 40px;
      margin-top: 6px;
      background: var(--gold-gradient);
      color: #7B0000;
      border: 1.5px solid #8B0000;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Top Search Input -->
    <div class="search-container">
      <span style="font-size: 14px; margin-right: 4px;">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search pandal or place (e.g. Gariahat, Tala)..." />
      <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Origin Action Buttons -->
    <div class="btn-row">
      <button class="action-btn" id="btnGPS" onclick="setOriginGPS()">📍 My Location</button>
      <button class="action-btn active" id="btnPin" onclick="activatePinDrop()">📌 Tap in Map</button>
    </div>
    <div id="statusText" style="font-size: 11px; color: #666; margin-bottom: 2px;">Tap anywhere on the map to set origin:</div>

    <!-- The Map Window (Centered on Kolkata, initially empty of markers) -->
    <div id="aoiPickerContainer"></div>

    <!-- Buffer Radius Controls -->
    <div class="buffer-pill-group" id="bufferGroup">
      <div class="buffer-pill selected" id="pill2" onclick="selectRadius(2)">
        <div class="pill-km">2 KM RADIUS</div>
        <div class="pill-count" id="count2">-</div>
      </div>
      <div class="buffer-pill" id="pill5" onclick="selectRadius(5)">
        <div class="pill-km">5 KM RADIUS</div>
        <div class="pill-count" id="count5">-</div>
      </div>
      <div class="buffer-pill" id="pill10" onclick="selectRadius(10)">
        <div class="pill-km">10 KM RADIUS</div>
        <div class="pill-count" id="count10">-</div>
      </div>
    </div>

    <!-- Pandal Selection Section -->
    <div id="listSection">
      <div style="font-size: 11px; font-weight: 700; color: #444; margin: 2px 0;">
        Select Pandals to Hop (<span id="selectedCount">0</span> selected):
      </div>
      <div class="pandal-list-box" id="pandalChecklist">
        <div style="font-size:11px; color:#888; padding:12px; text-align:center;">Set origin above to discover pandals.</div>
      </div>

      <button class="nav-btn" id="btnRoute" onclick="launchGoogleMapsRoute()" disabled>
        🧭 Hop Selected in Google Maps
      </button>
    </div>
  </div>

  <script>
    const TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const TILE_ATTRIB = '&copy; OpenStreetMap';

    let map = null;
    let originMarker = null;
    let bufferCircle = null;
    let pandalMarkersLayer = L.layerGroup();

    let allPandals = [];
    let originCoords = null; // Stays null at initial startup
    let originType = "PIN";
    let currentRadius = 2;
    let filteredPandals = [];
    let selectedPandals = new Set();

    // 1. Initialize Map centered on Central Kolkata (Esplanade / BBD Bagh) with NO points/markers
    map = L.map('aoiPickerContainer', { zoomControl: false }).setView([22.565, 88.363], 12);
    L.tileLayer(TILE_URL, { maxZoom: 18, attribution: TILE_ATTRIB }).addTo(map);
    pandalMarkersLayer.addTo(map);

    function parseCoords(feature) {
      if (!feature.geometry || !feature.geometry.coordinates) return [22.565, 88.363];
      let c = feature.geometry.coordinates;
      let x = parseFloat(c[0]), y = parseFloat(c[1]);

      if (Math.abs(x) > 180 || Math.abs(y) > 90) {
        let lng = (x / 20037508.34) * 180;
        let lat = (y / 20037508.34) * 180;
        lat = (180 / Math.PI) * (2 * Math.atan(Math.exp(lat * Math.PI / 180)) - Math.PI / 2);
        return [lat, lng];
      }

      if (x >= 21 && x <= 24 && y >= 87 && y <= 90) {
        return [x, y];
      }

      return [y, x];
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 2. Fetch Pandals GeoJSON (Parse only, do NOT render to map yet)
    fetch('./pandals_clean.geojson?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        allPandals = data.features || [];
        allPandals.forEach(p => { p.computedCoords = parseCoords(p); });
      })
      .catch(err => {
        document.getElementById('statusText').innerText = "Data load error: " + err.message;
      });

    // 3. User taps on map to set placemark & trigger buffer
    map.on('click', function(e) {
      originType = "PIN";
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      handleOriginSet(e.latlng.lat, e.latlng.lng, `Pin (${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`);
    });

    function activatePinDrop() {
      originType = "PIN";
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      document.getElementById('statusText').innerText = "Tap on the map to set origin:";
    }

    function setOriginGPS() {
      originType = "GPS";
      document.getElementById('btnGPS').classList.add('active');
      document.getElementById('btnPin').classList.remove('active');
      document.getElementById('statusText').innerText = "Detecting GPS...";

      navigator.geolocation.getCurrentPosition(
        pos => handleOriginSet(pos.coords.latitude, pos.coords.longitude, "Live GPS"),
        err => {
          navigator.geolocation.getCurrentPosition(
            pos => handleOriginSet(pos.coords.latitude, pos.coords.longitude, "Network Location"),
            err2 => { document.getElementById('statusText').innerText = "GPS unavailable. Tap on the map."; },
            { enableHighAccuracy: false, timeout: 10000 }
          );
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    }

    // 4. Set origin, draw buffer, and reveal ONLY points inside the buffer
    function handleOriginSet(lat, lng, label) {
      originCoords = [lat, lng];
      document.getElementById('statusText').innerText = "Origin: " + label;

      if (originMarker) {
        originMarker.setLatLng(originCoords);
      } else {
        originMarker = L.marker(originCoords, {
          icon: L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [22, 36], iconAnchor: [11, 36]
          })
        }).addTo(map);
      }

      calculateBuffers();
    }

    function calculateBuffers() {
      if (!originCoords || !allPandals.length) return;

      const count2 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 2).length;
      const count5 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 5).length;
      const count10 = allPandals.filter(p => haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1]) <= 10).length;

      document.getElementById('count2').innerText = count2;
      document.getElementById('count5').innerText = count5;
      document.getElementById('count10').innerText = count10;

      selectRadius(currentRadius);
    }

    function selectRadius(km) {
      currentRadius = km;
      [2, 5, 10].forEach(k => {
        document.getElementById('pill' + k).classList.toggle('selected', k === km);
      });

      if (!originCoords) return;

      // Update or create the buffer circle
      if (bufferCircle) {
        bufferCircle.setLatLng(originCoords);
        bufferCircle.setRadius(km * 1000);
      } else {
        bufferCircle = L.circle(originCoords, {
          radius: km * 1000,
          color: '#B71C1C',
          fillColor: '#D4AF37',
          fillOpacity: 0.16,
          weight: 2,
          dashArray: '4, 4'
        }).addTo(map);
      }

      map.fitBounds(bufferCircle.getBounds(), { padding: [12, 12] });

      // Filter pandals strictly inside the active buffer
      filteredPandals = allPandals.map(p => ({
        ...p,
        distance: haversine(originCoords[0], originCoords[1], p.computedCoords[0], p.computedCoords[1])
      })).filter(p => p.distance <= km)
        .sort((a, b) => a.distance - b.distance);

      // Render ONLY the filtered pandals onto the map
      pandalMarkersLayer.clearLayers();
      filteredPandals.forEach(p => {
        const name = p.properties.Pandal___C || p.properties.Name || "Pandal";
        const cat = p.properties.Puja_Categ || "Standard";

        const m = L.circleMarker(p.computedCoords, {
          radius: 5,
          fillColor: "#B71C1C",
          color: "#D4AF37",
          weight: 1.5,
          fillOpacity: 0.95
        }).bindPopup(`
          <div style="font-size:12px; font-family:sans-serif;">
            <b style="color:#B71C1C;">${name}</b><br/>
            <span style="font-size:10px; color:#555;">${cat}</span><br/>
            <span style="font-size:10px; color:#888;">${p.distance.toFixed(2)} km away</span>
          </div>
        `);
        pandalMarkersLayer.addLayer(m);
      });

      renderChecklist();
    }

    function renderChecklist() {
      const box = document.getElementById('pandalChecklist');
      box.innerHTML = '';
      selectedPandals.clear();
      updateRouteButton();

      if (!filteredPandals.length) {
        box.innerHTML = '<div style="font-size:11px; color:#888; padding:10px; text-align:center;">No pandals in this radius. Try 5 or 10 KM.</div>';
        return;
      }

      filteredPandals.forEach((p, idx) => {
        const name = p.properties.Pandal___C || p.properties.Name || "Durga Puja Pandal";
        const cat = p.properties.Puja_Categ || "Standard";
        const row = document.createElement('div');
        row.className = 'pandal-row';
        row.innerHTML = `
          <input type="checkbox" id="chk_${idx}" onchange="togglePandal(${idx})">
          <label for="chk_${idx}" style="cursor:pointer; flex:1;">
            <b>${name}</b> <span style="font-size:10px; color:#777;">(${cat})</span><br/>
            <span style="font-size:10px; color:#B71C1C; font-weight:700;">${p.distance.toFixed(2)} km away</span>
          </label>
        `;
        box.appendChild(row);
      });
    }

    function togglePandal(idx) {
      const p = filteredPandals[idx];
      if (selectedPandals.has(p)) selectedPandals.delete(p);
      else selectedPandals.add(p);
      document.getElementById('selectedCount').innerText = selectedPandals.size;
      updateRouteButton();
    }

    function updateRouteButton() {
      document.getElementById('btnRoute').disabled = selectedPandals.size === 0;
    }

    function launchGoogleMapsRoute() {
      if (selectedPandals.size === 0) return;
      const pList = Array.from(selectedPandals);

      let originParam = (originType === "PIN" && originCoords)
        ? `${originCoords[0]},${originCoords[1]}`
        : "Current+Location";

      if (pList.length === 1) {
        const dest = pList[0].computedCoords;
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${dest[0]},${dest[1]}&travelmode=driving`, '_blank');
        return;
      }

      const lastPandal = pList[pList.length - 1].computedCoords;
      const intermediate = pList.slice(0, -1).map(p => `${p.computedCoords[0]},${p.computedCoords[1]}`).join('|');
      window.open(`https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${lastPandal[0]},${lastPandal[1]}&waypoints=${encodeURIComponent(intermediate)}&travelmode=driving`, '_blank');
    }

    // 5. Two-Segment Search
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let searchDebounce = null;

    searchInput.addEventListener('input', function() {
      clearTimeout(searchDebounce);
      const query = this.value.trim();
      if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
      }
      searchDebounce = setTimeout(() => executeSearch(query), 250);
    });

    async function executeSearch(query) {
      const qLower = query.toLowerCase();

      // Segment 1: Pandals
      const matchedPandals = allPandals.filter(p => {
        const name = (p.properties.Pandal___C || p.properties.Name || "").toLowerCase();
        const address = (p.properties.Address || "").toLowerCase();
        return name.includes(qLower) || address.includes(qLower);
      }).slice(0, 5);

      // Segment 2: OpenStreetMap Places via Photon
      let matchedPlaces = [];
      try {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query + ' Kolkata')}&lat=22.565&lon=88.363&limit=5`);
        const json = await res.json();
        matchedPlaces = (json.features || []).map(f => ({
          name: f.properties.name || f.properties.street || query,
          sub: [f.properties.district, f.properties.city].filter(Boolean).join(', ') || 'Kolkata',
          lat: f.geometry.coordinates[1],
          lon: f.geometry.coordinates[0]
        }));
      } catch (err) {
        console.warn("Place search failed", err);
      }

      renderDividedResults(matchedPandals, matchedPlaces);
    }

    function renderDividedResults(pandals, places) {
      if (!pandals.length && !places.length) {
        searchResults.innerHTML = '<div style="padding:10px; font-size:12px; color:#888;">No matching pandals or places found.</div>';
        searchResults.style.display = 'block';
        return;
      }

      let html = '';

      if (pandals.length) {
        html += '<div class="search-segment-title">🪔 Durga Puja Pandals</div>';
        pandals.forEach(p => {
          const idx = allPandals.indexOf(p);
          const name = p.properties.Pandal___C || p.properties.Name;
          const cat = p.properties.Puja_Categ || "Standard";
          html += `
            <div class="search-item" onclick="selectPandalResult(${idx})">
              <b>${name}</b>
              <span class="search-item-sub">Category: ${cat}</span>
            </div>
          `;
        });
      }

      if (places.length) {
        html += '<div class="search-segment-title">📍 Places & Landmarks</div>';
        places.forEach(pl => {
          html += `
            <div class="search-item" onclick="selectPlaceResult(${pl.lat}, ${pl.lon}, '${pl.name.replace(/'/g, "\\'")}')">
              <b>📍 ${pl.name}</b>
              <span class="search-item-sub">${pl.sub}</span>
            </div>
          `;
        });
      }

      searchResults.innerHTML = html;
      searchResults.style.display = 'block';
    }

    function selectPandalResult(idx) {
      const p = allPandals[idx];
      searchResults.style.display = 'none';
      searchInput.value = p.properties.Pandal___C || p.properties.Name;
      originType = "PIN";
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      handleOriginSet(p.computedCoords[0], p.computedCoords[1], p.properties.Pandal___C || "Selected Pandal");
    }

    function selectPlaceResult(lat, lng, name) {
      searchResults.style.display = 'none';
      searchInput.value = name;
      originType = "PIN";
      document.getElementById('btnPin').classList.add('active');
      document.getElementById('btnGPS').classList.remove('active');
      handleOriginSet(lat, lng, name);
    }

    document.addEventListener('click', function(e) {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });
  </script>
</body>
</html>
