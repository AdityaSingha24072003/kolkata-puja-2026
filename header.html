<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kolkata Pujo Map 2026 Header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #6B0505;
    }

    .banner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 16px;
      background:
        linear-gradient(90deg, #580303 0%, #780808 55%, #650404 100%);
      border-top: 2px solid #A83214;
      border-bottom: 2px solid #D4AF37;
      position: relative;
    }

    /* Subtle architectural gridlines matching the Experience Builder banner */
    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(243, 229, 171, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(243, 229, 171, 0.06) 1px, transparent 1px);
      background-size: 90px 34px;
      pointer-events: none;
    }

    .emblem {
      flex-shrink: 0;
      height: 58px;
      width: 54px;
      z-index: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
    }

    .title-stack {
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 1;
    }

    .main-title {
      font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
      font-weight: 800;
      font-size: clamp(19px, 2.3vw, 29px);
      line-height: 1.05;
      letter-spacing: 1.2px;
      color: #EFE09A;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.55);
      text-transform: uppercase;
    }

    .sub-title {
      margin-top: 3px;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 800;
      font-size: clamp(9.5px, 1vw, 11.5px);
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
      opacity: 0.96;
    }
  </style>
</head>
<body>
  <div class="banner">
    <!-- Folded Map + Maa Durga Pin Emblem -->
    <svg class="emblem" viewBox="0 0 80 88" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Folded Map Panels -->
      <polygon points="8,36 28,28 28,80 8,86" fill="#3D0202" stroke="#EFE09A" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="28,28 52,36 52,86 28,80" fill="#4E0303" stroke="#EFE09A" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="52,36 72,28 72,80 52,86" fill="#3D0202" stroke="#EFE09A" stroke-width="2" stroke-linejoin="round"/>
      <!-- Dashed Route Line on Map -->
      <path d="M13 66 Q24 58 34 64 T66 56" stroke="#EFE09A" stroke-width="1.6" stroke-dasharray="3 3" fill="none"/>
      <circle cx="19" cy="62" r="2.3" fill="#EFE09A"/>
      <circle cx="60" cy="59" r="2.3" fill="#EFE09A"/>

      <!-- Location Pin -->
      <path d="M40 4 C26.5 4 17 14 17 26.5 C17 42.5 40 62 40 62 C40 62 63 42.5 63 26.5 C63 14 53.5 4 40 4 Z"
            fill="#7A0606" stroke="#EFE09A" stroke-width="2.5"/>
      <!-- Dashed Inner Ring -->
      <circle cx="40" cy="26.5" r="17.5" stroke="#EFE09A" stroke-width="1.3" stroke-dasharray="2.5 2.5"/>

      <!-- Stylized Maa Durga Crown, Third Eye, Eyes & Nose Ring -->
      <!-- Mukut (Crown) -->
      <path d="M33 16 L36 11 L40 7 L44 11 L47 16 Z" fill="#EFE09A"/>
      <!-- Trinetra (Third Eye) -->
      <ellipse cx="40" cy="19.5" rx="1.5" ry="2.8" fill="#EFE09A"/>
      <!-- Left & Right Eyes -->
      <path d="M27.5 25 Q32.5 21.5 37.5 25 Q32.5 28.5 27.5 25 Z" fill="#FFFFFF" stroke="#2B0202" stroke-width="0.8"/>
      <circle cx="32.5" cy="25" r="2" fill="#2B0202"/>
      <path d="M42.5 25 Q47.5 21.5 52.5 25 Q47.5 28.5 42.5 25 Z" fill="#FFFFFF" stroke="#2B0202" stroke-width="0.8"/>
      <circle cx="47.5" cy="25" r="2" fill="#2B0202"/>
      <!-- Eyebrows -->
      <path d="M27 22.2 Q32.5 19.5 37.5 22.5" stroke="#EFE09A" stroke-width="1.3" fill="none"/>
      <path d="M42.5 22.5 Q47.5 19.5 53 22.2" stroke="#EFE09A" stroke-width="1.3" fill="none"/>
      <!-- Nath (Nose Ring) -->
      <circle cx="41.5" cy="31.5" r="2.7" stroke="#EFE09A" stroke-width="1.3" fill="none"/>
    </svg>

    <div class="title-stack">
      <div class="main-title">KOLKATA PUJO MAP 2026</div>
      <div class="sub-title">PANDAL EXPLORER &amp; LIVE NAVIGATION</div>
    </div>
  </div>
</body>
</html>
